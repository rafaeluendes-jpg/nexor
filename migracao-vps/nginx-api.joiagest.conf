# /etc/nginx/sites-available/api.joiagest.com.br
# A porta do Supabase (8000) não fica aberta para fora: só o nginx, com HTTPS.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  server_name api.joiagest.com.br;
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name api.joiagest.com.br;
  ssl_certificate     /etc/letsencrypt/live/api.joiagest.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.joiagest.com.br/privkey.pem;
  client_max_body_size 25m;
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;          # tempo real (websocket)
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
  }
}
