name: Publicar Joia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ==========================================================
  # TESTE VERMELHO = NÃO PUBLICA (Rafael, 06/10/2026)
  #
  # Até aqui a publicação não dependia de teste nenhum: o testes.yml
  # avisava com um X vermelho, mas a loja recebia a versão do mesmo
  # jeito. Em 06/10/2026 a bateria estava vermelha na main (um guardião
  # com data fixa) e a parada no primeiro erro escondia as suítes
  # seguintes — e o sistema continuava sendo publicado.
  #
  # Agora `publicar` só começa se `bateria` passar inteira. Qualquer
  # reprovação deixa a loja na versão que já está no ar.
  # ==========================================================
  bateria:
    name: Bateria — npm test, vistoria, trava dos guardiões, nuvem
    runs-on: ubuntu-latest
    env:
      # o npm test roda tudo no jsdom; navegador nenhum é necessário aqui
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          # o jsdom da bateria exige Node 22.22+ (com o 20 ele nem carrega)
          node-version: '22'

      - name: Ferramentas da bateria
        run: npm ci --no-audit --no-fund

      - name: Vistoria — o código chama só o que existe
        run: node ferramentas/vistoriar.js

      - name: Trava dos guardiões — nenhum apagado, desligado ou enfraquecido
        run: node ferramentas/travar.js

      - name: Nuvem — o que o código manda é o que o banco aceita
        run: node ferramentas/conferir-nuvem.js

      - name: Bateria de testes — as suítes todas
        run: npm test

  publicar:
    needs: bateria
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ferramenta do enxugador
        # so o terser, nao a arvore inteira: o playwright das auditorias
        # baixaria navegador aqui a toa e so atrasaria a publicacao
        run: npm install --no-save --no-audit --no-fund terser@5

      - name: Montar a pasta do site
        run: |
          mkdir -p _site
          cp manifest.json supabase.js _site/
          # ==========================================================
          # O QUE VAI AO AR NAO LEVA O MANUAL JUNTO
          #
          # O index.html do repositorio e inteiro e comentado — e ele que
          # o testes/montagem.js confere byte a byte contra o src/. O que
          # a loja recebe passa pelo enxugador: sem os 2.373 blocos de
          # comentario que explicam a regra de negocio, o nome das tabelas
          # do banco e cada defeito ja corrigido. Roda identico, 28% menor.
          #
          # O enxugador PARA a publicacao se alguma funcao sumir ou se a
          # VERSAO deixar de ser legivel — sem ela a loja nunca mais
          # saberia que ha atualizacao (o defeito da V195).
          # ==========================================================
          node ferramentas/enxugar.js index.html _site/index.html
          cp *.png *.jpg _site/ 2>/dev/null || true
          # atalhos por loja: joiagest.com.br/santafe e afins. Sao pastas,
          # e o cp de arquivos soltos acima nao as levaria.
          # fotos dos produtos: ficam no site, e o cadastro guarda so o endereco
          [ -d fotos ] && cp -r fotos _site/
          for d in santafe santafedosul jales alphaville; do
            [ -d "$d" ] && cp -r "$d" _site/
          done
          for f in _headers sw.js CNAME; do
            [ -f "$f" ] && cp "$f" _site/
          done
          touch _site/.nojekyll
          ls -la _site

      - name: Preparar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
