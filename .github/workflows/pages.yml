# Publica o Nexor no GitHub Pages.
#
# Envia APENAS os arquivos do site, montados numa pasta limpa. Antes o pacote
# levava o repositório inteiro, incluindo o histórico do git e a própria pasta
# de workflows — peso desnecessário que deixava a publicação lenta e instável.
name: Publicar Nexor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Montar a pasta do site
        run: |
          mkdir -p _site
          cp index.html manifest.json _headers _site/
          cp nexor-*.png _site/
          touch _site/.nojekyll
          ls -la _site

      - name: Preparar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
